# Copy this file into a local memory store, then replace placeholders.
# Suggested target: ~/.memagent/memories/<your-id>.memory.yaml

id: "mem_manual_skill_route_example"
created_at: "YYYY-MM-DDTHH:MM:SS+08:00"
domain: "coding"
kind: "skill_route"
topic: "<task family that should route to an existing skill>"
scope:
  repo: "<repo-name-or-unknown>"
  module: "<module-or-unknown>"
triggers:
  - "<keyword>"
  - "<task phrase>"
applies_when:
  - "<when this skill should be used>"
recommended_action:
  type: "use_skill"
  target: "<skill-name>"
tool_recipes: []
entrypoints:
  - type: "skill"
    name: "<skill-name>"
    usage: "<what input/context to give the skill>"
pitfalls:
  - "<what not to do before using the skill>"
verification:
  - "<how to check the skill result>"
next_time_prompt:
  - "<short instruction to give Codex next time>"
agents_md_suggestion:
  - "<whether this should become a stable AGENTS.md rule>"
sensitivity:
  level: "internal"
  exportable: false
status:
  maturity: "draft"
  promotion_candidate: false
source_note: |
  <where this memory came from>
