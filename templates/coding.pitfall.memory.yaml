# Copy this file into a local memory store, then replace placeholders.
# Suggested target: ~/.memagent/memories/<your-id>.memory.yaml

id: "mem_manual_pitfall_example"
created_at: "YYYY-MM-DDTHH:MM:SS+08:00"
domain: "coding"
kind: "pitfall"
topic: "<pitfall topic>"
scope:
  repo: "<repo-name-or-unknown>"
  module: "<module-or-unknown>"
triggers:
  - "<keyword>"
  - "<failure mode>"
applies_when:
  - "<when this pitfall tends to happen>"
recommended_action:
  type: "avoid_path"
  target: "<bad path to avoid>"
tool_recipes: []
entrypoints: []
pitfalls:
  - "<the exact wrong path or repeated mistake>"
verification:
  - "<safer check to run instead>"
next_time_prompt:
  - "<short instruction to give Codex next time>"
agents_md_suggestion:
  - "<whether this should become a stable AGENTS.md rule>"
sensitivity:
  level: "internal"
  exportable: false
status:
  maturity: "draft"
  promotion_candidate: false
source_note: |
  <where this memory came from>
