# Copy this file into a local memory store, then replace placeholders.
# Suggested target: ~/.memagent/memories/<your-id>.memory.yaml

id: "mem_manual_data_entrypoint_example"
created_at: "YYYY-MM-DDTHH:MM:SS+08:00"
domain: "coding"
kind: "data_entrypoint"
topic: "<data entrypoint topic>"
scope:
  repo: "<repo-name-or-unknown>"
  module: "<module-or-unknown>"
triggers:
  - "<business/task keyword>"
  - "<data keyword>"
applies_when:
  - "<when this entrypoint is relevant>"
recommended_action:
  type: "query_data"
  target: "<main entrypoint>"
tool_recipes: []
entrypoints:
  - type: "rds_table"
    name: "<local-private-table-name>"
    usage: "<what to check in this table>"
  - type: "api"
    name: "<local-private-api-path>"
    usage: "<when to call this API>"
pitfalls:
  - "<wrong table/API/source to avoid>"
verification:
  - "<how to validate the data source or count>"
next_time_prompt:
  - "<short instruction to give Codex next time>"
agents_md_suggestion:
  - "<whether this should become a stable AGENTS.md rule>"
sensitivity:
  level: "internal"
  exportable: false
status:
  maturity: "draft"
  promotion_candidate: false
source_note: |
  <where this memory came from>
