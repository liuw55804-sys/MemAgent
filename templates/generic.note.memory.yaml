# Copy this file into a local memory store, then replace placeholders.
# Suggested target: ~/.memagent/memories/<your-id>.memory.yaml

id: "mem_manual_generic_note_example"
created_at: "YYYY-MM-DDTHH:MM:SS+08:00"
domain: "generic"
kind: "note"
topic: "<generic note topic>"
scope:
  repo: "unknown"
  module: "unknown"
triggers:
  - "<keyword>"
applies_when:
  - "<when this note is relevant>"
recommended_action:
  type: "remember_preference"
  target: "<what to remember>"
tool_recipes: []
entrypoints: []
pitfalls: []
verification: []
next_time_prompt:
  - "<short instruction to give the assistant next time>"
agents_md_suggestion:
  - "Keep this as local memory unless it becomes a stable coding rule."
sensitivity:
  level: "local"
  exportable: false
status:
  maturity: "draft"
  promotion_candidate: false
source_note: |
  <where this memory came from>
