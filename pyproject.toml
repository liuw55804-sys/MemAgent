[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "memagent"
version = "0.1.0"
description = "A local workflow memory layer for Codex and other coding agents."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
memagent = "memagent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

